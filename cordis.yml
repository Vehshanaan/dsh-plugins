# 本文件是挂载配置的源参考：运行时挂载在 $DSH_HOME/profiles/web/cordis.patch.yml
# （`dsh web` 零参数加载）。改插件配置时两处需同步；改插件代码后先重建 dist/。
# 路径中的绝对前缀是作者机器的 checkout 路径，换机器时替换（见 SETUP.md §3）。
# 构建：corepack pnpm install && corepack pnpm -r run build（仓库根目录）。
'
- insert:
    - id: automode-guardrail
      name: 'file:///<checkout>/automode-guardrail/dist/index.js'
      config:
        modes: ['danger-full-access']
        skip: []
        classifier:
          provider: deepseek-official
          model: deepseek-v4-flash
          maxInputBytes: 12000
          maxOutputTokens: 1024
          reasoningEffort: off
          timeoutMs: 5000

# /btw 旁路提问：问题与回答不进主对话历史。
- insert:
    - id: btw
      name: 'file:///<checkout>/btw/dist/index.js'

# /vscode open-in-editor: open the current workspace in VS Code.
- insert:
    - id: vscode
      name: 'file:///<checkout>/vscode/dist/index.js'
