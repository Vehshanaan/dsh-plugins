# MIGRATED: the live mount moved to $DSH_HOME/profiles/web/cordis.patch.yml
# (plain `dsh web` now loads these plugins — no --patch needed). This file is
# kept as the source reference for plugin configuration; edit BOTH places when
# changing plugin config, and rebuild the plugin's dist/ first.
#
# Auto-safety guardrail patch: screens tool calls while a session runs in an
# armed sandbox mode (default danger-full-access). Build first:
#   corepack pnpm install && corepack pnpm run build   (inside dsh-plugins)
- insert:
    - id: automode-guardrail
      name: 'file:///<checkout>/automode-guardrail/dist/index.js'
      config:
        modes: ['danger-full-access']
        skip: []
        classifier:
          provider: deepseek-official
          model: deepseek-v4-flash
          maxInputBytes: 12000
          maxOutputTokens: 1024
          reasoningEffort: off
          timeoutMs: 5000

# /btw side questions: ask a question that never enters the conversation
# history. Resolves @deepseek-ai/* from dsh-plugins/node_modules (junction to
# the profile dependency tree).
- insert:
    - id: btw
      name: 'file:///<checkout>/btw/dist/index.js'

# /vscode open-in-editor: open the current workspace in VS Code.
- insert:
    - id: vscode
      name: 'file:///<checkout>/vscode/dist/index.js'
